<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image To Sign</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            text-align: center;
        }
        #submit {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #submit:hover {
            background-color: #dbe117;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Extract To Sign</h1>
    <br><br>
    <form method="post" enctype="multipart/form-data">
        <label for="file">Upload an Image:</label>
        <input type="file" name="file" id="file">
        <br>
        <p>Or</p>
        <button type="button" onclick="openCamera()">Take Photo</button>
        <input type="file" name="camera" id="cameraInput" accept="image/*" capture="environment">
        <label for="url">Enter Image URL:</label>
        <input type="text" name="url" id="url" style="width: 300px;">
        <br><br>
        <input id="submit" type="submit" value="Extract Text">
    </form>
    <br>
    <h3>Extracted Text⏬:</h3>
    <textarea id="extracted_text" style="width: 400px; height: 150px;" placeholder="Extracted Text will Update Here">{{ extracted_text if extracted_text else 'Extracted Text will Update Here' }}</textarea>
    <br><br>
    <button id="translateButton">Translate</button>
    <br>
    <div id="output"></div>
    <script>
        function openCamera() {
            document.getElementById('cameraInput').click();
        }
    $(document).ready(function() {
        $('#translateButton').click(function() {
            const inputText = $('#extracted_text').val();
            $.ajax({
                type: 'POST',
                url: '/translate',
                data: JSON.stringify({ text: inputText }),
                contentType: 'application/json',
                success: function(response) {
                    $('#output').html(response.html);
                },
                error: function() {
                    alert('Error translating text.');
                }
            });
        });
    });
    </script>
</body>

</html>
